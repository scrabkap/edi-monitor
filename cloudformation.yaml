AWSTemplateFormatVersion: '2010-09-09'
Description: 'EDI Monitor Application Infrastructure - Updated Lambda handler'

Parameters:
  EnvironmentName:
    Type: String
    Default: 'dev'
    Description: Environment name (dev, staging, prod)

  S3BucketName:
    Type: String
    Default: 'edi-monitor'
    Description: S3 bucket name for EDI data

Resources:
  # S3 Bucket for EDI Data
  EDIDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - '*'
            MaxAge: 3600

  # S3 Bucket for Frontend Hosting
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${S3BucketName}-frontend'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # Bucket Policy for Frontend
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # CloudFront Distribution for Frontend
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !Sub '${FrontendBucket}.s3-website-${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # IAM Role for Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:ListBucket'
                Resource:
                  - !GetAtt EDIDataBucket.Arn
                  - !Sub '${EDIDataBucket.Arn}/*'

  # Lambda Function for EDI Processing
  EDIProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-edi-processor'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          S3_BUCKET: !Ref S3BucketName
          ENVIRONMENT: !Ref EnvironmentName
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime

          s3_client = boto3.client('s3')
          BUCKET = os.environ.get('S3_BUCKET', 'edi-monitor')

          def lambda_handler(event, context):
              try:
                  # Parse request
                  http_method = event.get('httpMethod', 'GET')
                  path = event.get('path', '')

                  # Route requests
                  if path == '/api/edi-data':
                      return get_edi_data()
                  elif path == '/api/master-data':
                      return get_master_data()
                  elif path == '/api/health':
                      return {
                          'statusCode': 200,
                          'headers': get_cors_headers(),
                          'body': json.dumps({'status': 'healthy', 'timestamp': datetime.now().isoformat()})
                      }
                  else:
                      return {
                          'statusCode': 404,
                          'headers': get_cors_headers(),
                          'body': json.dumps({'error': 'Not found'})
                      }
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': get_cors_headers(),
                      'body': json.dumps({'error': str(e)})
                  }

          def get_cors_headers():
              return {
                  'Content-Type': 'application/json',
                  'Access-Control-Allow-Origin': '*',
                  'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
                  'Access-Control-Allow-Methods': 'GET,POST,OPTIONS'
              }

          def get_edi_data():
              # This will be implemented to read EDI data from S3
              return {
                  'statusCode': 200,
                  'headers': get_cors_headers(),
                  'body': json.dumps({'message': 'EDI data endpoint - implementation pending'})
              }

          def get_master_data():
              # This will be implemented to read master data from S3
              return {
                  'statusCode': 200,
                  'headers': get_cors_headers(),
                  'body': json.dumps({'message': 'Master data endpoint - implementation pending'})
              }

  # API Gateway
  EDIMonitorAPI:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${EnvironmentName}-edi-monitor-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - '*'
        MaxAge: 300

  # API Gateway Integration
  APIIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref EDIMonitorAPI
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt EDIProcessorFunction.Arn
      PayloadFormatVersion: '2.0'

  # API Gateway Route
  APIRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref EDIMonitorAPI
      RouteKey: 'ANY /api/{proxy+}'
      Target: !Sub 'integrations/${APIIntegration}'

  # API Gateway Stage
  APIStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref EDIMonitorAPI
      StageName: !Ref EnvironmentName
      AutoDeploy: true

  # Lambda Permission for API Gateway
  LambdaAPIPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EDIProcessorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${EDIMonitorAPI}/*/*'

Outputs:
  APIEndpoint:
    Description: 'API Gateway endpoint URL'
    Value: !Sub 'https://${EDIMonitorAPI}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}'
    Export:
      Name: !Sub '${AWS::StackName}-APIEndpoint'

  FrontendURL:
    Description: 'Frontend CloudFront URL'
    Value: !GetAtt FrontendDistribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-FrontendURL'

  FrontendBucketName:
    Description: 'Frontend S3 Bucket Name'
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucket'

  EDIDataBucketName:
    Description: 'EDI Data S3 Bucket Name'
    Value: !Ref EDIDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-EDIDataBucket'
